name: Build Macro Player

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

jobs:
  test:
    name: Parser & playback tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build tests
        run: |
          cmake -S tests -B build-tests -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-tests -j

      - name: Generate GDR2 fixtures with the reference library
        run: ./build-tests/gdr2_generate build-tests/fixtures

      - name: Cross-check GDR1 sample macros against the reference library
        run: |
          mkdir -p build-tests/samples
          for f in tests/samples/*.gdr; do
            [ -e "$f" ] || continue
            n=$(basename "$f" .gdr)
            cp "$f" build-tests/samples/
            ./build-tests/gdr1_dump "$f" "build-tests/samples/$n.expected" "build-tests/samples/$n.json"
          done

      - name: Run tests
        run: ./build-tests/macro_tests build-tests/fixtures build-tests/samples

  build:
    needs: ['test']
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

        - name: macOS
          os: macos-latest

        - name: iOS
          os: macos-latest
          target: iOS

        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package .geode
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: Macro Player
          path: ${{ steps.build.outputs.build-output }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.build-output }}/*.geode
